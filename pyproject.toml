[project]
name = "voice-demo"
version = "0.1.0"
description = "Three voice-agent backends (LiveKit / OpenAI Realtime / Google ADK Live) sharing one console interface, each instrumented for LangSmith the way its framework intends."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "langsmith>=0.4",
    "httpx>=0.27",
    "pydantic>=2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
openai = [
    "openai>=1.50",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
adk = [
    "google-adk>=2.0",
    "google-genai>=1.75",
    "langsmith[google-adk]>=0.4",
]
livekit = [
    "livekit-agents[openai,silero,turn-detector]>=1.0",
]

[project.scripts]
voice-demo = "voice_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_demo"]
