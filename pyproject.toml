[project]
name = "voice-demo"
version = "0.1.0"
description = "Voice-agent backends (OpenAI Realtime, Google ADK Live, LiveKit STT/LLM/TTS, Pipecat, and LiveKit speech-to-speech for OpenAI Realtime / Gemini Live), each instrumented for LangSmith the way its framework intends."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "langsmith>=0.4",
    "httpx>=0.27",
    "pydantic>=2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
openai = [
    "openai>=1.50",
]
openai-agents = [
    # Same Realtime model as the `openai` extra, driven through the Agents SDK.
    "openai-agents[realtime]>=0.2",
    "openai>=1.50",
]
adk = [
    "google-adk>=2.0",
    "google-genai>=1.75",
    "langsmith[google-adk]>=0.4",
]
livekit = [
    # The agent is LiveKit-native (no LangChain brain): openai = STT/LLM/TTS and
    # the OpenAI Realtime model; silero/turn-detector = the cascade pipeline.
    "livekit-agents[openai,silero,turn-detector]>=1.0",
    # Gemini Live (google.beta.realtime) for the livekit-google-realtime backend.
    "livekit-plugins-google>=1.0",
]
pipecat = [
    # openai: STT/LLM/TTS services · local: LocalAudioTransport (mic/speaker) ·
    # tracing: the OTel/setup helpers. Silero VAD ships in pipecat core.
    "pipecat-ai[openai,local,tracing]>=1.0",
    # The LLM "brain" is an in-process LangChain agent (create_agent) over LangGraph.
    "langgraph>=0.2",
    "langchain>=1.3.9",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
]

[project.scripts]
voice-demo = "voice_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_demo"]
